name: 功能建议
description: 想要的新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        开心果的目标是一直简单、一直快，不是每个建议都会做，但每个都会认真看。
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么不方便
      description: 先说场景和痛点，而不是解决方案。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 希望怎么做
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 现在是怎么凑合的
    validations:
      required: false
